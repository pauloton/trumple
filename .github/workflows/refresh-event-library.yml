name: Refresh Trumple event library

on:
  schedule:
    # Saturday evening in US time zones; Sunday 02:00 UTC.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      today:
        description: "Optional YYYY-MM-DD date used for a backfill or test run"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-event-library
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect and curate the week
        env:
          REQUESTED_TODAY: ${{ inputs.today }}
        run: |
          if [ -n "$REQUESTED_TODAY" ]; then
            npm run library:refresh -- --today "$REQUESTED_TODAY"
          else
            npm run library:refresh
          fi

      - run: npm run check

      - name: Publish approved library additions
        run: |
          if git diff --quiet; then
            echo "No new events passed automatic publication checks this week."
            exit 0
          fi
          git config user.name "trumple-editor-bot"
          git config user.email "trumple-editor-bot@users.noreply.github.com"
          git add data/generated-events.js
          git commit -m "Publish verified weekly events"
          git push origin HEAD:main
