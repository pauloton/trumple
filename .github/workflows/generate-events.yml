name: Generate Trumple Events

on:
  schedule:
    # Friday at 9pm UTC — events ready for Saturday review
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to generate'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - weekly
          - second-term

jobs:
  generate-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate events via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ github.event.inputs.edition || 'both' }}
        run: node scripts/generate-events.mjs

      - name: Get current date for branch name
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Open draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-generate Trumple events for ${{ steps.date.outputs.date }}"
          branch: "auto/trumple-events-${{ steps.date.outputs.date }}"
          delete-branch: true
          draft: true
          title: "🗓️ Trumple Events — ${{ steps.date.outputs.date }} (review before merging)"
          body: |
            ## Auto-generated Trumple events

            These events were generated by Claude on Friday night. **Review carefully before merging** — merging deploys to Vercel automatically.

            ### Checklist before merging
            - [ ] All titles are ≤ 50 characters
            - [ ] No em dashes
            - [ ] Trump only — no other politicians or cabinet members
            - [ ] Sardonic voice, either ridicule or outrage
            - [ ] Dates look correct and events are in the right order
            - [ ] Weekly events are actually from this week
            - [ ] 2nd Term events are plausible additions to the standing pool

            ---
            *To regenerate, close this PR and re-run the workflow manually from Actions tab.*
